[tool.poetry]
name = "perp-finish-cam"
version = "1.0.0"
description = "Software-based slot camera system for finish-line photography"
authors = ["Till Schulte-Coerne <till@perp.de>"]
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14.1 || >3.14.1,<3.15"
requests = "^2.31.0"
opencv-python = "^4.9.0.80"
numpy = "^1.26.3"
quart = "^0.19.4"
perp-cnn = { git = "https://github.com/tillsc/perp_cnn.git", optional = true }
torch = { version = ">=2.11", optional = true }
torchvision = { version = ">=0.26", optional = true }

[tool.poetry.extras]
ai = ["perp-cnn", "torch", "torchvision"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
